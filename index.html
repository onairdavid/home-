<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onair.David | Sportmoderator & Stadionstimme</title>
    <style>
        :root {
            --bg-color: #0b0b0d;
            --card-bg: #131317;
            --accent-color: #39ff14; /* Neon-Laufgrün */
            --accent-glow: rgba(57, 255, 20, 0.3);
            --text-color: #ffffff;
            --text-muted: #94949c;
            --input-bg: #1c1c22;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Header mit Blur-Effekt */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: rgba(11, 11, 13, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #1c1c22;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .live-badge {
            background-color: #ff3333;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
            animation: pulse 2s infinite;
            letter-spacing: 1px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 5% 50px;
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
        }

        /* Profilbild-Styling mit Puls-Ring */
        .profile-container {
            width: 210px;
            height: 210px;
            margin: 0 auto 30px;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            overflow: hidden;
            box-shadow: 0 0 30px var(--accent-glow);
            background-color: #131317;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .profile-container:hover {
            transform: scale(1.05);
        }

        .profile-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            line-height: 1.05;
            letter-spacing: -1px;
        }

        .hero h1 span {
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 650px;
            margin: 0 auto 35px;
        }

        .cta-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 30px;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(57, 255, 20, 0.6);
        }

        .btn-secondary {
            border: 2px solid #2a2a35;
            color: var(--text-color);
            background: transparent;
        }

        .btn-secondary:hover {
            background-color: #1c1c22;
            border-color: var(--accent-color);
            transform: translateY(-3px);
        }

        /* Stats & Highlights Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 5%;
        }

        /* Ticker / Zahlen */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #131317 0%, #1c1c22 100%);
            border: 1px solid #22222a;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 35px;
            border: 1px solid #1c1c22;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: transparent;
            transition: background-color 0.3s ease;
        }

        .card:hover {
            border-color: #2c2c35;
            transform: translateY(-2px);
        }

        .card:hover::before {
            background-color: var(--accent-color);
        }

        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h3 span {
            color: var(--accent-color);
        }

        .card ul {
            list-style: none;
        }

        .card ul li {
            margin-bottom: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.95rem;
        }

        .card ul li::before {
            content: "➔";
            color: var(--accent-color);
            font-weight: bold;
        }

        /* Kontaktformular Section */
        .contact-section {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 45px;
            margin-top: 60px;
            border: 1px solid #1c1c22;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .contact-section h2 {
            font-size: 2.2rem;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .contact-section p {
            color: var(--text-muted);
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fff;
        }

        .form-control {
            width: 100%;
            padding: 16px;
            background-color: var(--input-bg);
            border: 1px solid #2a2a35;
            border-radius: 12px;
            color: var(--text-color);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 140px;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 90px;
            padding-top: 35px;
            border-top: 1px solid #1c1c22;
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        footer a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            color: var(--accent-color);
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.6rem; }
            header { padding: 15px 5%; }
            .profile-container { width: 170px; height: 170px; }
            .contact-section { padding: 30px; }
